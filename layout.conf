# Plateau for MPC OS -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py, docs/SKIN_STUDIO.md).
# Coordinates are Force Shadow pixels: the plugin area is x 0..1280, y 86..714.
#
# Each page takes the look of the module it stands for: Plateau (Valley, dark), the CV inputs and sequencers in
# Plateau's colours, the LFO page as Bogaudio's LFO (light), Tidal Modulator 2 and Random Sampler as VCV's Mutable
# Instruments panels (light grey). tools/knob_art.py draws each knob family by RADIUS, so the radius picks the art:
#   Valley Med:   r=58 blue, r=47 green, r=46 red, r=44 white      Valley Small: r=36 white, 37 green, 38 blue, 39 red
#   Bogaudio:     r=57 Knob68, r=42 Knob26, r=34 Knob16              VCV Rogan:    r=56 3PS, r=48 2PS, r=40 1PS (white)
# tools/post_skin.py repaints every page image from this file: the panel colour (#@panel), frames and popup fields,
# and the "#@" decorations (#@title, #@text, #@box, #@line, #@dots, #@dotcurve, #@braid). A full-page frame with
# banks= gives a sub-page its own page image, so its lettering can differ from its neighbours'. On the light pages, toggles have no live name (ns=0) and enums and popups no baked label: their
# names are #@text, in the panel's ink.
# Q-Link lists: keys 1-8 = knob bank 1, 9-16 = bank 2; "-" leaves a slot empty.
scale_names=1
label_scale=1.1
theme_bg=282828
theme_panel=282828
theme_line=ffffff
theme_ink=ffffff
theme_ink_dim=bdbdbd
theme_ink_faint=6a6a6a
theme_accent=307dee
theme_accent_hi=ffffff
theme_knob_face=1c1c1c
theme_knob_ring=307dee
theme_knob_dot=ffffff
theme_bar=282828
theme_seg_active=ffffff
theme_seg_inactive=1c1c1c
theme_seg_active_tx=111111
theme_btn_text=ffffff
theme_tab_on=ffffff
theme_tab_on_tx=111111
theme_lcd=1c1c1c
theme_box=1c1c1c
qlinks_track = size,diffusion,decay,wet,dry,pre_delay,rv_low,rv_high,mod_rate,mod_shape,mod_depth,in_low,in_high,hold,clear,tuned

