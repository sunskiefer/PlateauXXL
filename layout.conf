# Plateau for MPC OS -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py, docs/SKIN_STUDIO.md).
# Colours are VCV Rack Plateau's dark panel; knob art is Valley's Rogan knobs, put on by tools/knob_art.py,
# which picks the colour from the knob radius:
#   r=58 blue (tank), r=47 green (filters), r=46 red (modulation), r=44 white (levels)
# Q-Link lists: keys 1-8 = knob bank 1, 9-16 = bank 2.
scale_names=1
label_scale=1.1
theme_bg=282828
theme_panel=282828
theme_line=ffffff
theme_ink=ffffff
theme_ink_dim=bdbdbd
theme_ink_faint=6a6a6a
theme_accent=307dee
theme_accent_hi=ffffff
theme_knob_face=1c1c1c
theme_knob_ring=307dee
theme_knob_dot=ffffff
theme_bar=282828
theme_seg_active=ffffff
theme_seg_inactive=1c1c1c
theme_seg_active_tx=111111
theme_btn_text=ffffff
theme_tab_on=ffffff
theme_tab_on_tx=111111
theme_lcd=1c1c1c
theme_box=1c1c1c
qlinks_track = size,diffusion,decay,wet,dry,pre_delay,rv_low,rv_high,mod_rate,mod_shape,mod_depth,in_low,in_high,hold,clear,tuned

[tab PLATEAU]
frame x=10 y=92 w=444 h=300 title=""
knob cx=82 cy=236 r=58 label="SIZE" key=size
knob cx=232 cy=236 r=58 label="DIFFUSION" key=diffusion
knob cx=382 cy=236 r=58 label="DECAY" key=decay
frame x=462 y=92 w=444 h=300 title=""
knob cx=534 cy=236 r=44 label="DRY" key=dry
knob cx=684 cy=236 r=44 label="WET" key=wet
knob cx=834 cy=236 r=44 label="PRE-DELAY" key=pre_delay
frame x=914 y=92 w=356 h=300 title=""
toggle cx=998 cy=200 label="HOLD" key=hold
button cx=1186 cy=200 label="CLEAR" key=clear
toggle cx=998 cy=310 label="TUNED" key=tuned
toggle cx=1186 cy=310 label="DIFFUSE IN" key=diffuse_in
frame x=10 y=400 w=596 h=308 title=""
knob cx=82 cy=548 r=47 label="IN LOW" key=in_low
knob cx=232 cy=548 r=47 label="IN HIGH" key=in_high
knob cx=382 cy=548 r=47 label="REV LOW" key=rv_low
knob cx=532 cy=548 r=47 label="REV HIGH" key=rv_high
frame x=614 y=400 w=444 h=308 title=""
knob cx=686 cy=548 r=46 label="RATE" key=mod_rate
knob cx=836 cy=548 r=46 label="SHAPE" key=mod_shape
knob cx=986 cy=548 r=46 label="DEPTH" key=mod_depth
frame x=1066 y=400 w=204 h=308 title=""
toggle cx=1168 cy=500 label="SATURATE" key=saturate
qlinks "PLATEAU" = size,diffusion,decay,wet,dry,pre_delay,rv_low,rv_high,mod_rate,mod_shape,mod_depth,in_low,in_high,hold,clear,tuned
